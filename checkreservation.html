<!DOCTYPE html>
<html>
<head>
    <title>PSWProject - My Reservations</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Public/Assets/css/bootstrap.min.css">
    
    <style>
        /* ==========================================
           BUMBU RESPONSIVE KHUSUS MOBILE (HP)
           ========================================== */
        @media (max-width: 768px) {
            h2.text-success {
                font-size: 1.5rem; /* Mengecilkan ukuran judul */
            }
            .nav-tabs .nav-link {
                padding: 0.5rem 0.8rem; /* Mengecilkan area klik tab */
                font-size: 0.9rem; /* Mengecilkan teks tab */
            }
            .table {
                font-size: 0.85rem; /* Mengecilkan tulisan di dalam tabel */
            }
            .btn-outline-dark {
                width: 100%; /* Tombol kembali menjadi full-width (lebar penuh) di HP */
            }
        }
        
        /* Agar tab bisa digeser ke samping tanpa turun ke baris baru (anti terlipat) */
        .nav-tabs {
            flex-wrap: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
        }
        
        /* Menyembunyikan garis scrollbar pada tab agar terlihat bersih */
        .nav-tabs::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body class="bg-light">

    <div class="container py-4 py-md-5 col-12 col-md-9 mt-3">

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 gap-3">
            <h2 class="fw-bold text-success text-center mb-0">My Reservations</h2>
            <a href="dashboard.html" class="btn btn-outline-dark shadow-sm">Back to Dashboard</a>
        </div>

        <ul class="nav nav-tabs border-dark shadow-sm" id="customerTabs" role="tabpanel">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#ongoing">Ongoing</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#upcoming">Upcoming</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#history">History</button></li>
        </ul>

        <div class="tab-content bg-white p-3 p-md-4 border rounded-bottom shadow-sm" id="customerReservationContent">
            
            <div class="tab-pane fade show active" id="ongoing">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-success">
                            <tr><th>Date</th><th>Court</th><th>Session</th><th>Status</th></tr>
                        </thead>
                        <tbody id="customerOngoingTable">
                        </tbody>
                    </table>
                </div>
            </div>
        
            <div class="tab-pane fade" id="upcoming">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-primary">
                            <tr><th>Date</th><th>Court</th><th>Session</th><th>Status</th></tr>
                        </thead>
                        <tbody id="customerUpcomingTable">
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="tab-pane fade" id="history">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-secondary">
                            <tr><th>Date</th><th>Court</th><th>Session</th><th>Status</th></tr>
                        </thead>
                        <tbody id="customerHistoryTable">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('get_my_reservations.php')
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    renderCustomerTable('customerOngoingTable', data.ongoing);
                    renderCustomerTable('customerUpcomingTable', data.upcoming);
                    renderCustomerTable('customerHistoryTable', data.history);
                } else {
                    alert('Gagal memuat data: ' + data.message);
                }
            })
            .catch(error => console.error('Error fetching data:', error));
        });

        function renderCustomerTable(tbodyId, dataArray) {
            const tbody = document.getElementById(tbodyId);
            tbody.innerHTML = ''; 

            if(dataArray.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-3">Tidak ada data</td></tr>';
                return;
            }

            dataArray.forEach(row => {
                let badgeColor = 'bg-secondary';
                if(row.status === 'Pending') badgeColor = 'bg-warning text-dark';
                if(row.status === 'Approved') badgeColor = 'bg-primary';
                if(row.status === 'Canceled') badgeColor = 'bg-danger';
                if(row.status === 'Finished') badgeColor = 'bg-success';

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-nowrap">${row.date}</td>
                    <td class="text-nowrap">${row.court}</td>
                    <td class="text-nowrap">${row.session}</td>
                    <td><span class="badge ${badgeColor}">${row.status}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
    <script src="Public/Assets/js/bootstrap.bundle.min.js"></script>
</body>
</html>
